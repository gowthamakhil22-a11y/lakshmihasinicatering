<!doctype html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Lakshmi Hasini Catering</title>
<meta name="robots" content="noindex" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF6EA;color:#1F3328;font-family:'DM Sans',system-ui,sans-serif;text-align:center;padding:24px}
  .mark{width:64px;height:64px;margin:0 auto 24px;border-radius:16px;background:#0F4A2E;color:#FBF6EA;display:grid;place-items:center;font:500 24px Georgia,serif}
  h1{font:500 30px/36px Georgia,serif;color:#0F4A2E;margin:0 0 12px}
  p{margin:0 0 24px;font-size:16px;line-height:24px;color:#4F5F55}
  a{display:inline-block;background:#0F4A2E;color:#FBF6EA;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:600}
  a:focus-visible{outline:2px solid #C29A45;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">LH</div>
    <h1>This page is not on our menu</h1>
    <p>The link may be outdated. Our full menu is one tap away.</p>
    <a id="home" href="./">Open the menu</a>
  </main>
  <script>
    // Send visitors to the site root, whether hosted at / or /<repo>/.
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var isProjectSite = location.hostname.endsWith('github.io') && seg;
    document.getElementById('home').href = isProjectSite ? '/' + seg + '/' : '/';
  </script>
</body>
</html>
